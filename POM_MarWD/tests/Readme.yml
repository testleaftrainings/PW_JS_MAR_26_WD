POM: It is a design pattern for organizing the code in test automation.

It helps to separate UI locators and interactions into dedicated page classes, instead of writing everything inside test 
scripts.

Each web page (or module) in the application is represented by a separate class and that class contains locators and 
methods that act on that page.


ex: 

Loginpage --> WelcomePage --> HomePage --> LeadPage --> CreateLeadPage --> VerifyLead
                                      ---> AccountPage --> CreateAccountPage -->VerifyAccount

Features:
---------

Reusability - write once, use everywhere
Maintainability - if UI changes, update in one place
Readability - test scripts become clean and easy to understand
Scalability - works well for large projects


Steps to run this POM:
----------------------

1) install node_modules using command "npm install", from root directory
2) now execute the spec file



