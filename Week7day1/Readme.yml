OOPs:
----

OOP (Object-Oriented Programming) is a programming method that structures software by designing objects, where each 
object contains data (properties) and behavior (methods)

4 pillars of OOPs:
------------------

1. Encapsulation: Bundling data and the methods that operate on that data into a single unit (class) and restricting
 access using access modifiers.

2. Inheritance: A mechanism where a new class (child class) inherits properties and behaviors from an existing class 
(parent class), allowing for code reusability and the creation of hierarchical relationships.

3. Polymorphism: The ability of different classes to be treated as instances of the same class through a common interface,
 often achieved through method overriding or method overloading.

4. Abstraction: The process of hiding the complex implementation details and showing only the necessary features

Features of OOPs:
-----------------
1. Reusable
2. Maintainable
3. Readable
4. Scalable
5. Redundant

